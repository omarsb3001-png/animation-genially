<script>
(()=>{'use strict';
const redPhrases=["On est pas bien là ?", "Elle est super canon Margaux", "Faut que je range ma chambre !", "j'peux me lécher le coude ?", "Faut que l'OM éclate le PSG !", "Elle est nulle la StarAc cette année", "C'est pas Versailles ici !!", "Ya la mouche qui m'suit", "Il pleut comme vache qui pisse", "Ça me saoule !", "Le Brie qui dit au Roquefort qu'il pue", "J'ai la tête dans l'c..", "Déjà les films de Noël...en octobre !", "Gims, sans lunette, ça donne quoi ?", "Je verrai toujours vos visages.", "La chance n'existe pas, ça s'appelle le destin.", "J'aime qu'on m'aime comme je m'aime", "Demain, je ne peux pas, j'ai aqua-poney.", "Le yoga nigra ...", "Hé, Ho, tu descends ?", "Mon lit est un aimant géant.", "Pfff j'suis un fatigué de la vie"];
const pieces=['De haut','en bas,','partez des besoins.','De gauche','à droite,','suivez','chaque fil','et récoltez','les lettres','sur votre','passage.'];
const field=document.getElementById('field');const scene=document.getElementById('scene');let shapes=[],started=false,soundOn=true,last=0,audio=null,elapsed=0;
const random=(a,b)=>a+Math.random()*(b-a);
function makeShape(text,color,index,isBlue){
 const el=document.createElement('div');el.className='shape '+color;el.textContent=text;
 const w=isBlue?Math.max(215,Math.min(405,Math.round(text.length*15+110))):(text?Math.max(225,Math.min(490,Math.round(text.length*12+95))):random(90,160));
 const h=isBlue?random(120,155):(text?random(120,155):random(80,140));
 el.style.width=w+'px';el.style.height=h+'px';el.style.display='none';field.appendChild(el);
 const fw=field.clientWidth,fh=field.clientHeight;
 // Les bleues entrent des quatre côtés, avec des trajectoires et vitesses variées.
 const side=isBlue?index%4:Math.floor(random(0,4));
 const speed=isBlue?random(190,380):random(145,340);
 const angle=side===0?random(-.32,.32):side===1?Math.PI+random(-.32,.32):side===2?Math.PI/2+random(-.32,.32):-Math.PI/2+random(-.32,.32);
 const vx=Math.cos(angle)*speed,vy=Math.sin(angle)*speed;
 const x=side===0?-w-15:side===1?fw+15:random(0,Math.max(0,fw-w));
 const y=side===2?-h-15:side===3?fh+15:random(0,Math.max(0,fh-h));
 // Ordre d'entrée des bleues respecté. Chaque phrase rouge ne traverse qu'une seule fois.
 const delay=isBlue?index*1.65:random(0,9)+index*.38;
 return {el,w,h,x,y,vx,vy,phase:random(0,6.28),rot:random(-8,8),age:0,delay,visible:false,finished:false,isBlue};
}
function setup(){field.replaceChildren();shapes=[];elapsed=0;
 pieces.forEach((piece,i)=>shapes.push(makeShape(piece,'blue',i,true)));
 redPhrases.forEach((phrase,i)=>shapes.push(makeShape(phrase,'red',i,false)));
 const colors=['yellow','green','purple','orange','pink','teal'];
 for(let i=0;i<9;i++)shapes.push(makeShape('',colors[i%colors.length],i,false));
}
function tick(ts){if(!started)return;const dt=Math.min((ts-last)/1000||0,.05);last=ts;elapsed+=dt;
 const W=field.clientWidth,H=field.clientHeight;
 for(const s of shapes){
  if(s.finished||elapsed<s.delay)continue;
  if(!s.visible){s.visible=true;s.el.style.display='flex'}
  s.age+=dt;s.x+=s.vx*dt;s.y+=s.vy*dt;
  const bob=Math.sin(s.age*1.2+s.phase)*5;
  s.el.style.transform=`translate3d(${s.x}px,${s.y+bob}px,0) rotate(${s.rot+Math.sin(s.age*.8+s.phase)*4}deg)`;
  // Une seule traversée par forme : aucun recyclage ni réapparition.
  if(s.age>0.6&&(s.x>W+35||s.x+s.w< -35||s.y>H+35||s.y+s.h< -35)){
   s.finished=true;s.el.style.display='none';
  }
 }
 requestAnimationFrame(tick);
}
// Continuous embedded crowd recording (speech fragments, laughter, sneezes), no internet required.
function initAudio(){
 if(audio)return;
 const element=document.getElementById('crowdAudio');element.loop=true;element.volume=1;
 const AC=window.AudioContext||window.webkitAudioContext;
 if(AC){
  const ctx=new AC();const source=ctx.createMediaElementSource(element);
  const gain=ctx.createGain();gain.gain.value=2.0;
  const limiter=ctx.createDynamicsCompressor();limiter.threshold.value=-12;limiter.knee.value=6;limiter.ratio.value=10;limiter.attack.value=.003;limiter.release.value=.18;
  source.connect(gain);gain.connect(limiter);limiter.connect(ctx.destination);
  audio={ctx,element,gain};
 }else audio={element};
}
function toggleSound(){
 soundOn=!soundOn;
 document.getElementById('sound').textContent='Son : '+(soundOn?'activé':'coupé');
 if(audio){audio.element.muted=!soundOn;if(audio.gain)audio.gain.gain.setTargetAtTime(soundOn?2.0:0,audio.ctx.currentTime,.05);}
}
document.getElementById('launch').onclick=async()=>{document.getElementById('start').style.display='none';setup();started=true;last=performance.now();try{initAudio();if(audio){if(audio.ctx)await audio.ctx.resume();await audio.element.play()}}catch(e){}requestAnimationFrame(tick)};
document.getElementById('sound').onclick=toggleSound;

document.getElementById('restart').onclick=()=>{setup();if(audio){audio.element.currentTime=0;audio.element.muted=!soundOn}};
document.getElementById('full').onclick=async()=>{try{if(!document.fullscreenElement)await scene.requestFullscreen();else await document.exitFullscreen()}catch(e){}};
window.addEventListener('resize',()=>{for(const s of shapes)s.y=Math.max(0,Math.min(field.clientHeight-s.h,s.y))});
})();
</script></body></html>
